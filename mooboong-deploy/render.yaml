services:
  - type: web
    name: mooboong
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
